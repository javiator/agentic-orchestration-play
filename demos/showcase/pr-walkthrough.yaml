# Built with the pr-walkthrough skill: a walkthrough of branch claude/zen-dijkstra-sulp2q.
# Live part: the learning hub page, served from videos/ (python3 -m http.server --directory videos).
slug: pr-walkthrough
kicker: "Pull request · agentic-orchestration-play"
tts: kokoro
voice: am_michael
start: /index.html
defaults: {tag: PR, wait_caption: "loading…"}

concept:
- kind: title
  title: Videos become a skill — and five tools built on it
  lead: The learning-video scripts are now a reusable Claude Code skill, plus five workflow skills from IDEAS.md.
  chips: [demo-video, pr-walkthrough, bug-repro, briefing, living-docs, codebase-tour]
  say: >-
    This pull request turns the learning-video scripts into a reusable Claude Code skill, and adds
    five skills built on top of it, one for each idea in the ideas file. Here's what changed, and how
    to review it.

- kind: bullets
  title: What changed
  items:
  - "scripts/videos/ → .claude/skills/demo-video: self-contained, own venv and cache"
  - "Demos are YAML data (demos/*.yaml), not Python — Claude writes and edits them"
  - "Natural Kokoro voice, loudness-normalized audio; all 13 videos re-recorded"
  - "New slides (code, charts, stats), expect: checks, console capture, audio-only"
  - "Five workflow skills: walkthroughs, bug repro, briefings, living docs, code tours"
  say: >-
    Five changes matter. The video code moved into a self-contained skill. Demos are now YAML data
    instead of Python, so Claude can write and edit them. Narration uses a far more natural voice,
    and all thirteen videos were re-recorded with it. The engine gained code, chart and stats slides,
    checks, and console capture. And five workflow skills build on all of that.

- kind: code
  title: "A demo step is data now"
  file: ../router.yaml
  lines: "62-75"
  highlight: ["65-67", "68-71"]
  say: >-
    Here are two steps from the router demo. The click and the wait are plain data. And what used
    to be a Python lambda is now a template: this narration reads the traffic mix from the page
    while recording, so it always matches what the models actually did on this run.

steps:
- say: >-
    The learning hub is generated by the skill too. Each exercise card now has a poster frame and
    its length in the table of contents.
  caption: The new hub page
  highlight: 'nav.toc'
  hold: 1.0
- say: >-
    Under every video there are chapters, taken from the video's own timeline. Clicking one jumps
    the video straight to that part.
  caption: Clickable chapters
  highlight: 'first:.chapters'
  actions: [js: "document.querySelector('#router').scrollIntoView({block: 'start'})", pause: 0.3]
  hold: 1.5
- say: >-
    And a full transcript, with a time stamp on every line, so you can search a video, or skim it
    instead of watching.
  caption: Searchable transcript
  highlight: 'first:details.transcript'
  actions: [js: "document.querySelectorAll('details.transcript')[0].open = true", wheel: 260]
  hold: 2.0
  expect:
  - visible: 'details.transcript[open] p'

outro:
- kind: code
  title: "bug-repro: the verdict"
  file: ../../.claude/skills/bug-repro/scripts/repro.py
  lines: "55-70"
  highlight: ["65-68"]
  say: >-
    The workflow skills stay tiny. Bug repro, for example, replays a script with the engine and
    turns its problems into a verdict: reproduced, not reproduced, or inconclusive when the script
    itself is broken.
- kind: takeaways
  title: How to review
  items:
  - "Run the self-test: python3 .claude/skills/demo-video/scripts/selftest.py"
  - "Dry-run any demo against mock mode; read timeline.json after a real build"
  - "Try a workflow skill on your own branch, bug or CSV — then read its SKILL.md"
  say: >-
    To review: run the self-test, which builds a video end to end in about a minute. Dry-run any
    demo against mock mode, and read the timeline after a real build. Then try one of the workflow
    skills on your own branch, bug or data file.
  pause: 2.0
  foot: "main..claude/zen-dijkstra-sulp2q"

hub:
  eyebrow: "PR walkthrough · built with pr-walkthrough"
  summary: What this branch changes — the demo-video skill, the re-recorded videos and five workflow skills — and how to review it.
