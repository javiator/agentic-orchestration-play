<!doctype html>
<html><head><meta charset="utf-8"><title>Tiny shop (bug-repro example)</title>
<style>
  body { font: 18px system-ui, sans-serif; margin: 0; padding: 30px 40px; background: #f5f6fa; color: #1b2033; }
  .card { background: #fff; border: 1px solid #dde1ec; border-radius: 12px; padding: 18px 22px; margin-bottom: 18px; max-width: 640px; }
  td { padding: 6px 14px 6px 0; } input { width: 4em; } #total { font-size: 26px; font-weight: 700; }
</style></head>
<body>
<h1>Tiny shop</h1>
<section class="card" id="cart">
  <table>
    <tr><td>Desk lamp</td><td>$24.50</td><td><input id="qty-lamp" type="number" value="1" min="0"></td></tr>
    <tr><td>Notebook</td><td>$3.20</td><td><input id="qty-notebook" type="number" value="2" min="0"></td></tr>
  </table>
  <label>Discount code <input id="code" style="width: 9em"></label>
  <button id="apply">Apply</button>
  <p>Total: <span id="total"></span></p>
  <p id="msg"></p>
</section>
<script>
  // The same page served from fixed/ behaves correctly: it stands in for the fix branch.
  const FIXED = location.pathname.includes('/fixed/');  // fixed/ = the "fix branch"
  const prices = {lamp: 24.5, notebook: 3.2};
  let discount = 0;
  function total() {
    let t = 0;
    for (const k in prices) {
      const raw = document.getElementById('qty-' + k).value;
      const q = FIXED ? (parseInt(raw, 10) || 0) : parseInt(raw, 10);   // BUG: empty field → NaN
      t += q * prices[k];
    }
    t = t * (1 - discount);
    document.getElementById('total').textContent = '$' + t.toFixed(2);
  }
  document.querySelectorAll('input[type=number]').forEach(i => i.addEventListener('input', total));
  document.getElementById('apply').onclick = () => {
    const code = document.getElementById('code').value.trim();
    if (code.toUpperCase() === 'SAVE10') { discount = 0.1; document.getElementById('msg').textContent = '10% off applied.'; }
    else {
      fetch('api/codes/' + encodeURIComponent(code)).catch(() => {});                          // 404s: no backend
      document.getElementById('msg').textContent = FIXED ? 'Unknown code.' : undefined.message;  // BUG: throws
    }
    total();
  };
  total();
</script>
</body></html>
