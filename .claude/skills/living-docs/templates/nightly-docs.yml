# Nightly docs check (copy to .github/workflows/living-docs.yml). Regenerates the guides
# against the app; fails if a guide no longer matches the UI, and opens a PR-ready
# artifact with the new screenshots when they changed. Fill in "Start the app".
name: Living docs
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
  pull_request:
    paths: ["app/**", "guides/**", "docs/guides/**"]
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/demo-video
          key: demo-video-${{ hashFiles('.claude/skills/demo-video/requirements.txt') }}
      - name: Start the app            # ← project-specific; prefer a mock/seeded mode
        run: echo "e.g. MOCK_MODELS=true ./start.sh"
      - name: Regenerate guides
        run: |
          python3 .claude/skills/demo-video/scripts/setup.py
          ~/.cache/demo-video/venv/bin/python -m playwright install --with-deps chromium
          python3 .claude/skills/living-docs/scripts/docs.py docs/guides/src/*.yaml \
            --base http://localhost:8000 --out docs/guides
      - name: Upload changed screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guides
          path: docs/guides
