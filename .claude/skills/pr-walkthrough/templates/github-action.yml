# Build PR walkthrough videos in CI (copy to .github/workflows/pr-walkthrough.yml).
# Runs when a PR gets the `walkthrough` label, builds every .walkthrough/*.yaml on the
# PR branch with the demo-video skill, uploads the MP4s as a run artifact and comments
# with the link. Fill in "Start the app" for your project.
name: PR walkthrough video
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  walkthrough:
    if: contains(github.event.pull_request.labels.*.name, 'walkthrough')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: System packages (ffmpeg with libass, espeak-ng fallback)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Cache the skill venv, voices and TTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/demo-video
          key: demo-video-${{ hashFiles('.claude/skills/demo-video/requirements.txt') }}
      - name: Start the app            # ← project-specific
        run: |
          echo "Start your app here, in the background, e.g.:"
          echo "  MOCK_MODELS=true ./start.sh"
          # ./start.sh && sleep 5
      - name: Build walkthrough videos
        run: |
          python3 .claude/skills/demo-video/scripts/setup.py
          ~/.cache/demo-video/venv/bin/python -m playwright install --with-deps chromium
          python3 .claude/skills/demo-video/scripts/build.py .walkthrough/*.yaml \
            --base http://localhost:8000 --out walkthrough-out || echo "problems found (see timeline.json)"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: walkthrough-${{ github.event.pull_request.number }}
          path: |
            walkthrough-out/*.mp4
            walkthrough-out/*.srt
            walkthrough-out/*/timeline.json
      - name: Comment with the link
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `🎬 Walkthrough video for this PR: download **walkthrough-${context.issue.number}** from [this run](${url}).`,
            });
